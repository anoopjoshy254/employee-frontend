<div class="employees-container">
  
  <div class="employees-header">
    <div>
      <h1>Employee Directory</h1>
      <p class="subtitle">Manage company team members and roles</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary" (click)="goBack()">
        ← Back to Home
      </button>
      <button class="btn btn-primary" (click)="addNew()">
        + Add Employee
      </button>
    </div>
  </div>

  <div class="no-data" *ngIf="loading">
    <p>Fetching employee records from server...</p>
  </div>

  <div class="employees-grid" *ngIf="!loading && employees && employees.length > 0">
    
    <div class="employee-card" *ngFor="let emp of employees">
      
      <div class="card-header">
        <h3>{{ emp.firstName }} {{ emp.lastName }}</h3>
        <span class="department">ID: #{{ emp.id }}</span>
      </div>

      <div class="card-body">
        <div class="info-row">
          <span class="label">First Name:</span>
          <span class="value">{{ emp.firstName }}</span>
        </div>
        <div class="info-row">
          <span class="label">Last Name:</span>
          <span class="value">{{ emp.lastName }}</span>
        </div>
        <div class="info-row">
          <span class="label">Email:</span>
          <span class="value">{{ emp.email }}</span>
        </div>
      </div>

      <div class="card-actions">
        <button type="button" class="btn-icon btn-edit" (click)="editEmployee(emp.id)">
          Edit Profile
        </button>
        <button type="button" class="btn-icon btn-delete" (click)="deleteEmployee(emp.id)">
          Delete
        </button>
      </div>

    </div>
  </div>

  <div class="no-data" *ngIf="!loading && (!employees || employees.length === 0)">
    <p>No active employee records found in the directory.</p>
  </div>

</div>
