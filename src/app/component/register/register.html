<div class="register-container">
  <div class="register-card">

    <div class="register-header">
      <h1>Create Account</h1>
      <p class="subtitle">Join us and get started</p>
    </div>

    <form
      [formGroup]="registerForm"
      (ngSubmit)="onSubmit()"
      class="register-form">

      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName" class="form-label">Full Name</label>

        <input
          type="text"
          id="fullName"
          class="form-control"
          [class.is-invalid]="submitted && f['fullName'].errors"
          formControlName="fullName"
          placeholder="Enter your full name" />

        <div *ngIf="submitted && f['fullName'].errors" class="error-message">

          <span *ngIf="f['fullName'].errors!['required']">
            Full name is required
          </span>

          <span *ngIf="f['fullName'].errors!['minlength']">
            Name must be at least 2 characters
          </span>

        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>

        <input
          type="email"
          id="email"
          class="form-control"
          [class.is-invalid]="submitted && f['email'].errors"
          formControlName="email"
          placeholder="Enter your email" />

        <div *ngIf="submitted && f['email'].errors" class="error-message">

          <span *ngIf="f['email'].errors!['required']">
            Email is required
          </span>

          <span *ngIf="f['email'].errors!['email']">
            Please enter a valid email
          </span>

        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password" class="form-label">Password</label>

        <input
          type="password"
          id="password"
          class="form-control"
          [class.is-invalid]="submitted && f['password'].errors"
          formControlName="password"
          placeholder="Enter your password" />

        <div *ngIf="submitted && f['password'].errors" class="error-message">

          <span *ngIf="f['password'].errors!['required']">
            Password is required
          </span>

          <span *ngIf="f['password'].errors!['minlength']">
            Password must be at least 4 characters
          </span>

        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword" class="form-label">
          Confirm Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          class="form-control"
          [class.is-invalid]="submitted &&
          (f['confirmPassword'].errors ||
          registerForm.errors?.['passwordMismatch'])"
          formControlName="confirmPassword"
          placeholder="Confirm your password" />

        <div
          *ngIf="submitted && f['confirmPassword'].errors"
          class="error-message">

          <span *ngIf="f['confirmPassword'].errors!['required']">
            Confirm password is required
          </span>

        </div>

        <div
          *ngIf="submitted && registerForm.errors?.['passwordMismatch']"
          class="error-message">

          Passwords do not match

        </div>
      </div>

      <!-- API Error -->
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loading">

        <span *ngIf="!loading">
          Create Account
        </span>

        <span *ngIf="loading">
          Creating Account...
        </span>

      </button>

    </form>

    <div class="form-footer">
      <p class="login-text">

        Already have an account?

        <button
          type="button"
          class="login-link"
          (click)="goToLogin()">

          Sign in here

        </button>

      </p>
    </div>

  </div>
</div>
