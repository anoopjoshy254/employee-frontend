<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input
          type="email"
          id="email"
          class="form-control"
          [class.is-invalid]="submitted && f['email']?.errors"
          formControlName="email"
          placeholder="Enter your email"
        />
        <div *ngIf="submitted && f['email']?.errors" class="error-message">
          <span *ngIf="f['email']?.errors!['required']">Email is required</span>
          <span *ngIf="f['email']?.errors!['email']">Please enter a valid email</span>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          class="form-control"
          [class.is-invalid]="submitted && f['password']?.errors"
          formControlName="password"
          placeholder="Enter your password"
        />
        <div *ngIf="submitted && f['password']?.errors" class="error-message">
          <span *ngIf="f['password']?.errors!['required']">Password is required</span>
          <span *ngIf="f['password']?.errors!['minlength']">Password must be at least 6 characters</span>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loading"
      >
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">Signing In...</span>
      </button>
    </form>

    <!-- Register Link -->
    <div class="form-footer">
      <p class="register-text">
        Don't have an account?
        <button type="button" class="register-link" (click)="goToRegister()">
          Create one here
        </button>
      </p>
    </div>
  </div>
</div>
